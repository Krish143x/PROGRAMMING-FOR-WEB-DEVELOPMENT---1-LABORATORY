<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Flexbox Layout</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 18px 7%;
      background: #183153;
      color: white;
    }

    nav .links {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    nav a {
      color: white;
      text-decoration: none;
    }

    main {
      padding: 28px 7%;
    }

    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .card {
      flex: 1 1 220px;
      background: white;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #00000012;
    }

    .card h2 {
      color: #2457a7;
    }

    @media (max-width: 520px) {
      nav {
        flex-direction: column;
        align-items: flex-start;
      }

      nav .links {
        flex-direction: column;
        gap: 10px;
      }

      main {
        padding: 18px;
      }
    }
  </style>
</head>
<body>
  <nav>
    <strong>MyWebsite</strong>
    <div class="links"><a href="#">Home</a><a href="#">About</a><a href="#">Services</a><a href="#">Contact</a></div>
  </nav>
  <main>
    <h1>Our Services</h1>
    <div class="cards">
      <article class="card">
        <h2>Web Design</h2>
        <p>Clean and attractive website layouts.</p>
      </article>
      <article class="card">
        <h2>Development</h2>
        <p>Responsive websites using HTML and CSS.</p>
      </article>
      <article class="card">
        <h2>UI Design</h2>
        <p>Simple and user-friendly interfaces.</p>
      </article>
      <article class="card">
        <h2>Support</h2>
        <p>Help with updates and improvements.</p>
      </article>
    </div>
  </main>
</body>

</html>
