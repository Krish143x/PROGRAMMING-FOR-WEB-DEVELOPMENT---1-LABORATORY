<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sticky Navbar and Card Overlay</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fa;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #142d4e;
      padding: 18px;
      text-align: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
    }

    main {
      max-width: 850px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      position: relative;
      max-width: 520px;
      overflow: hidden;
      border-radius: 14px;
      background: white;
      box-shadow: 0 5px 18px #0002;
    }

    .card img {
      display: block;
      width: 100%;
      height: 280px;
      object-fit: cover;
    }

    .overlay {
      position: absolute;
      top: 14px;
      right: 14px;
      background: #e85d04;
      color: white;
      padding: 9px 14px;
      border-radius: 20px;
    }

    .content {
      padding: 18px;
    }

    .extra {
      min-height: 700px;
      padding-top: 25px;
    }
  </style>
</head>

<body>
  <nav><a href="#">Home</a><a href="#card">Featured</a><a href="#more">More</a></nav>
  <main>
    <h1>Featured Destination</h1>
    <article class="card" id="card">
      <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1000" alt="Mountain landscape">
      <span class="overlay">Featured</span>
      <div class="content">
        <h2>Explore Nature</h2>
        <p>Discover beautiful places and enjoy the outdoors.</p>
      </div>
    </article>
    <section class="extra" id="more">
      <h2>Scroll to See the Sticky Navbar</h2>
      <p>The navigation bar remains at the top while the page scrolls.</p>
    </section>
  </main>
</body>

</html>
