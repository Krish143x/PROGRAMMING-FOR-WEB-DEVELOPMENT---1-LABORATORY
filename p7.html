<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Design Tokens</title>
  <style>
    :root {
      --color-primary: #2457a7;
      --color-accent: #f59e0b;
      --color-text: #263238;
      --color-surface: #ffffff;
      --space-small: 8px;
      --space-medium: 16px;
      --space-large: 28px;
      --radius: 12px;
      --font-body: Arial, sans-serif;
      --font-heading: Georgia, serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: var(--space-large); font-family: var(--font-body); color: var(--color-text); background: #eef2f7; }
    h1, h2 { font-family: var(--font-heading); }
    h1 { color: var(--color-primary); }
    .card { max-width: 650px; background: var(--color-surface); padding: var(--space-large); border-radius: var(--radius); box-shadow: 0 4px 14px #00000012; }
    .tag { display: inline-block; background: var(--color-accent); padding: var(--space-small) var(--space-medium); border-radius: var(--radius); }
    button { background: var(--color-primary); color: white; border: 0; padding: 12px 20px; border-radius: var(--radius); }
  </style>
</head>
<body>
  <main class="card">
    <span class="tag">Design System</span>
    <h1>Consistent CSS Styling</h1>
    <h2>Reusable Design Tokens</h2>
    <p>CSS variables make a website easier to maintain. Changing a token updates every element that uses it.</p>
    <button type="button">Learn More</button>
  </main>
</body>
</html>
